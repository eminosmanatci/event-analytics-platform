version: '3.8'

services:
  # PostgreSQL Veritabanı
  db:
    image: postgres:16-alpine
    container_name: event-analytics-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres  # Buradaki şifre ile backend'deki aynı olmalı
      POSTGRES_DB: event_analytics
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d event_analytics"]
      interval: 5s
      timeout: 5s
      retries: 5

  # FastAPI Backend
  backend:
    build: ./backend
    container_name: event-analytics-backend
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/event_analytics
      APP_NAME: Event Analytics Platform
      DEBUG: "True"
      API_V1_PREFIX: /api/v1
    volumes:
      - ./backend/app:/app/app
    ports:
      - "8000:8000"  # Dışarıdan erişim için kritik
    depends_on:
      db:
        condition: service_healthy

  # React Frontend (Vite)
  frontend:
    build: ./frontend
    container_name: event-analytics-frontend
    environment:
      - VITE_API_URL=http://localhost:8000/api/v1
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend
    command: npm run dev -- --host

volumes:
  postgres_data: